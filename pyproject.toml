[project]
name = "experiment"
version = "0.1.0"
requires-python = ">=3.11,<3.12"
dependencies = [
    "pyyaml==6.0.2",
    "scigym",
    "scikit-learn==1.7.2",
]

[tool.uv]
package = false
# aarch64 に wheel が無い固定版だけ差し替える（RIKYU の scigym_improvement と同じ）
override-dependencies = [
    "antimony==2.14.0",
    "libroadrunner==2.7.0",
]
exclude-dependencies = ["rrplugins", "phrasedml"]

[tool.uv.sources]
scigym = { git = "https://github.com/h4duan/SciGym", rev = "88a7b93609e35b6ecb4eb343d816d6ff09256c6a" }

[dependency-groups]
eval = ["airas-eval==0.10.0"]
